<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Coding Pattern Tracker</title>
  <style>
    :root {
        --bg-color: #0d0d0f;
        --surface-color: #161618;
        --surface-hover: #1e1e22;
        --surface-elevated: #1a1a1e;
        --primary-color: #a78bfa;
        --primary-glow: rgba(167, 139, 250, 0.15);
        --secondary-color: #34d399;
        --secondary-glow: rgba(52, 211, 153, 0.15);
        --accent-color: #f472b6;
        --text-primary: #f1f0f5;
        --text-secondary: #8b8a99;
        --text-muted: #555466;
        --border-color: #252530;
        --border-subtle: #1e1e28;
        --success-color: #34d399;
        --card-radius: 12px;
        --transition: all 0.25s ease;
        --easy-color: #34d399;
        --easy-bg: rgba(52, 211, 153, 0.1);
        --medium-color: #fbbf24;
        --medium-bg: rgba(251, 191, 36, 0.1);
        --hard-color: #f87171;
        --hard-bg: rgba(248, 113, 113, 0.1);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        padding-bottom: 80px;
    }

    /* ===== HEADER ===== */
    header {
        background: linear-gradient(135deg, #111115 0%, #161620 100%);
        padding: 22px 5%;
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 18px;
        gap: 15px;
    }

    h1 {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -0.3px;
    }

    h1 .logo-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 15px rgba(167,139,250,0.3);
    }

    .header-stats {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .stat-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.85rem;
    }

    .stat-pill .stat-value {
        font-weight: 700;
        color: var(--primary-color);
    }

    .stat-pill .stat-label {
        color: var(--text-secondary);
    }

    .progress-wrap {
        width: 100%;
    }

    .progress-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 0.82rem;
        color: var(--text-secondary);
    }

    .progress-info strong {
        color: var(--primary-color);
        font-size: 0.95rem;
    }

    .progress-container {
        width: 100%;
        background-color: rgba(255,255,255,0.05);
        border-radius: 10px;
        height: 8px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--primary-color), var(--accent-color), var(--secondary-color));
        background-size: 200% 100%;
        width: 0%;
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        animation: shimmer 3s linear infinite;
        border-radius: 10px;
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* ===== CONTROLS ===== */
    .controls {
        padding: 18px 5%;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        background-color: var(--bg-color);
        border-bottom: 1px solid var(--border-subtle);
        max-width: 100%;
    }

    .search-box {
        flex: 1;
        min-width: 220px;
        position: relative;
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }

    .search-box input {
        width: 100%;
        padding: 11px 15px 11px 42px;
        border-radius: var(--card-radius);
        border: 1px solid var(--border-color);
        background-color: var(--surface-color);
        color: var(--text-primary);
        font-size: 0.95rem;
        outline: none;
        transition: var(--transition);
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .search-box input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-glow);
        background-color: var(--surface-elevated);
    }

    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: var(--card-radius);
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 0.875rem;
        white-space: nowrap;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        color: #fff;
        box-shadow: 0 4px 15px rgba(167,139,250,0.25);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(167,139,250,0.4);
    }

    .btn-outline {
        background-color: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
    }

    .btn-outline:hover {
        border-color: var(--hard-color);
        color: var(--hard-color);
        background: var(--hard-bg);
    }

    /* ===== ACHIEVEMENTS ===== */
    .achievements-strip {
        padding: 18px 5% 8px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .achievements-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
    }

    .achievement-card {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at top right, rgba(167, 139, 250, 0.18), transparent 38%),
            linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        animation: floatCard 5s ease-in-out infinite;
    }

    .achievement-card:nth-child(2) { animation-delay: 0.4s; }
    .achievement-card:nth-child(3) { animation-delay: 0.8s; }
    .achievement-card:nth-child(4) { animation-delay: 1.2s; }

    .achievement-card:hover {
        transform: translateY(-4px);
        border-color: rgba(167, 139, 250, 0.35);
        box-shadow: 0 18px 34px rgba(0,0,0,0.28);
    }

    .achievement-card.unlocked {
        border-color: rgba(251, 191, 36, 0.35);
        box-shadow: 0 16px 36px rgba(251, 191, 36, 0.12);
    }

    .achievement-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.06), transparent);
        transform: translateX(-120%);
        animation: cardShine 6s linear infinite;
        pointer-events: none;
    }

    .achievement-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 12px;
    }

    .achievement-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .achievement-card.unlocked .achievement-icon {
        background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(244,114,182,0.15));
        border-color: rgba(251,191,36,0.2);
        animation: pulseGlow 2.2s ease-in-out infinite;
    }

    .achievement-status {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        background: rgba(255,255,255,0.03);
    }

    .achievement-card.unlocked .achievement-status {
        color: #fcd34d;
        border-color: rgba(251,191,36,0.24);
        background: rgba(251,191,36,0.12);
    }

    .achievement-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 2px;
    }

    .achievement-subtitle {
        color: var(--text-secondary);
        font-size: 0.8rem;
        margin-bottom: 12px;
    }

    .achievement-progress {
        height: 7px;
        background: rgba(255,255,255,0.05);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .achievement-progress-bar {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary-color), var(--accent-color), #fcd34d);
        transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 16px rgba(167, 139, 250, 0.25);
    }

    .achievement-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.78rem;
        color: var(--text-secondary);
    }

    .achievement-value {
        font-weight: 700;
        color: var(--text-primary);
    }

    /* ===== MAIN CONTENT ===== */
    main {
        padding: 24px 5%;
        max-width: 1000px;
        margin: 0 auto;
    }

    .section-intro {
        margin-bottom: 20px;
        font-size: 0.85rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* ===== PATTERN CARD ===== */
    .pattern-section {
        margin-bottom: 12px;
        background-color: var(--surface-color);
        border-radius: var(--card-radius);
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .pattern-section:hover {
        border-color: #2e2e3a;
        box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    .pattern-section.all-done {
        border-color: rgba(52, 211, 153, 0.25);
    }

    .pattern-header {
        padding: 16px 20px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
        gap: 12px;
        transition: background 0.2s;
    }

    .pattern-header:hover {
        background-color: var(--surface-hover);
    }

    .pattern-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
    }

    .pattern-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
        background: var(--primary-glow);
        color: var(--primary-color);
    }

    .pattern-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .pattern-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .pattern-status {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border-color);
        padding: 3px 10px;
        border-radius: 20px;
        white-space: nowrap;
    }

    .pattern-status.completed-badge {
        color: var(--success-color);
        background: var(--secondary-glow);
        border-color: rgba(52, 211, 153, 0.2);
    }

    .chevron {
        color: var(--text-muted);
        transition: transform 0.3s ease;
        flex-shrink: 0;
    }

    .pattern-header.active .chevron {
        transform: rotate(180deg);
    }

    /* Mini progress bar inside pattern */
    .pattern-mini-progress {
        height: 3px;
        background: rgba(255,255,255,0.04);
        width: 100%;
    }

    .pattern-mini-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        transition: width 0.5s ease;
    }

    /* ===== QUESTION LIST ===== */
    .question-list {
        display: none;
        padding: 6px 0;
    }

    .question-list.open {
        display: block;
        animation: slideDown 0.25s ease-out;
    }

    .question-item {
        display: flex;
        align-items: center;
        padding: 11px 20px;
        border-bottom: 1px solid var(--border-subtle);
        transition: background 0.15s, transform 0.2s ease, border-color 0.2s ease;
        gap: 12px;
        position: relative;
    }

    .question-item:last-child {
        border-bottom: none;
    }

    .question-item:hover {
        background-color: var(--surface-hover);
        transform: translateX(2px);
    }

    .question-item.highlight {
        background: linear-gradient(90deg, rgba(167,139,250,0.08), transparent);
        border-left: 3px solid var(--primary-color);
        animation: selectedPulse 1.6s ease-in-out infinite;
    }

    .question-item.completed {
        opacity: 0.65;
    }

    .question-item.just-completed {
        animation: completePop 0.45s ease;
    }

    /* ===== CHECKBOX — Fixed with <label> wrapping ===== */
    .checkbox-label {
        position: relative;
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        cursor: pointer;
        display: block;
    }

    .checkbox-label input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        pointer-events: none;
    }

    .checkmark {
        position: absolute;
        inset: 0;
        background-color: transparent;
        border: 2px solid var(--text-muted);
        border-radius: 6px;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .checkmark svg {
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        stroke: #fff;
    }

    .checkbox-label:hover .checkmark {
        border-color: var(--primary-color);
        background: var(--primary-glow);
    }

    .checkbox-label input[type="checkbox"]:checked ~ .checkmark {
        background-color: var(--success-color);
        border-color: var(--success-color);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
    }

    .checkbox-label input[type="checkbox"]:checked ~ .checkmark svg {
        opacity: 1;
        transform: scale(1);
    }

    /* ===== QUESTION ROW CONTENT ===== */
    .question-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
    }

    .question-link {
        color: var(--text-primary);
        text-decoration: none;
        font-size: 0.9rem;
        flex: 1;
        min-width: 0;
        transition: color 0.15s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .question-link:hover {
        color: var(--primary-color);
    }

    .question-item.completed .question-link {
        text-decoration: line-through;
        color: var(--text-muted);
    }

    .question-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .difficulty-badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .badge-easy   { color: var(--easy-color);   background: var(--easy-bg); }
    .badge-medium { color: var(--medium-color); background: var(--medium-bg); }
    .badge-hard   { color: var(--hard-color);   background: var(--hard-bg); }

    .external-link-icon {
        color: var(--text-muted);
        opacity: 0;
        transition: opacity 0.2s;
        flex-shrink: 0;
    }

    .question-item:hover .external-link-icon {
        opacity: 1;
    }

    /* ===== TOAST ===== */
    .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: var(--surface-elevated);
        color: var(--text-primary);
        padding: 12px 22px;
        border-radius: 50px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        border: 1px solid var(--border-color);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        white-space: nowrap;
    }

    .toast.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }

    .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 1rem; }

    /* ===== ANIMATIONS ===== */
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    @keyframes cardShine {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(120%); }
    }

    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 rgba(251,191,36,0.15); }
        50% { box-shadow: 0 0 18px rgba(251,191,36,0.28); }
    }

    @keyframes completePop {
        0% { transform: scale(0.98); }
        60% { transform: scale(1.015); }
        100% { transform: scale(1); }
    }

    @keyframes selectedPulse {
        0%, 100% { box-shadow: inset 0 0 0 rgba(167,139,250,0); }
        50% { box-shadow: inset 0 0 0 999px rgba(167,139,250,0.03); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
        .achievements-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 640px) {
        header { padding: 16px 4%; }
        .controls { padding: 14px 4%; }
        .achievements-strip { padding: 14px 4% 4px; }
        main { padding: 16px 4%; }
        .header-stats { display: none; }
        .pattern-header { padding: 14px 16px; }
        .question-item { padding: 10px 14px; }
        .pattern-title { font-size: 0.9rem; }
        .achievements-grid { grid-template-columns: 1fr; }
        .achievement-card { padding: 14px; }
        .achievement-footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>
      <span class="logo-icon">
        <svg fill="none" height="18" stroke="white" stroke-linecap="round" stroke-linejoin="round"
             stroke-width="2.5" viewBox="0 0 24 24" width="18">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </span>
      Code Pattern Tracker
    </h1>
    <div class="header-stats">
      <div class="stat-pill">
        <span class="stat-value" id="solved-count">0</span>
        <span class="stat-label">/ <span id="total-count">0</span> Solved</span>
      </div>
      <div class="stat-pill">
        <span class="stat-value" id="progress-text">0%</span>
        <span class="stat-label">Done</span>
      </div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span>Overall Progress</span>
      <span><strong id="progress-percent">0%</strong> complete</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="main-progress-bar"></div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="search-box">
    <svg class="search-icon" fill="none" height="16" stroke="currentColor" stroke-linecap="round"
         stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <label for="search-input"></label><input id="search-input"
                                             placeholder="Search patterns or questions..."
                                             type="text">
  </div>
  <button class="btn btn-primary" onclick="pickDailyChallenge()">
    <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round"
         stroke-linejoin="round"
         stroke-width="2.5" viewBox="0 0 24 24" width="16">
      <polygon points="5 3 19 12 5 21 5 3"></polygon>
    </svg>
    Pick Daily Question
  </button>
  <button class="btn btn-outline" onclick="resetData()">
    <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round"
         stroke-linejoin="round"
         stroke-width="2" viewBox="0 0 24 24" width="16">
      <path d="M3 6h18"></path>
      <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
      <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
    </svg>
    Reset
  </button>
</div>

<section class="achievements-strip">
  <div class="achievements-grid" id="achievements-grid">
    <!-- Achievement cards will be injected here via JavaScript -->
  </div>
</section>

<main id="tracker-container">

              { title: "Implement Trie (Prefix Tree) (medium)", link: "https://leetcode.com/problems/implement-trie-prefix-tree/" },
              { title: "Index Pairs of a String (easy)", link: "https://leetcode.com/problems/index-pairs-of-a-string/" },
              { title: "Design Add and Search Words Data Structure (medium)", link: "https://leetcode.com/problems/design-add-and-search-words-data-structure/" },
              { title: "Extra Characters in a String (medium)", link: "https://leetcode.com/problems/extra-characters-in-a-string/" },
              { title: "Search Suggestions System (medium)", link: "https://leetcode.com/problems/search-suggestions-system/" }
          ]
      },
      {
          pattern: "Pattern: Topological Sort (Graph)",
          questions: [
              { title: "Topological Sort (medium)", link: "https://www.geeksforgeeks.org/topological-sorting/" },
              { title: "Tasks Scheduling (medium)", link: "https://leetcode.com/problems/course-schedule/" },
              { title: "Tasks Scheduling Order (medium)", link: "https://leetcode.com/problems/course-schedule-ii/" },
              { title: "All Tasks Scheduling Orders (hard)", link: "https://leetcode.com/problems/course-schedule-ii/" },
              { title: "Alien Dictionary (hard)", link: "https://leetcode.com/problems/alien-dictionary/" },
              { title: "Problem Challenge 1: Reconstructing a Sequence (hard)", link: "https://leetcode.com/problems/sequence-reconstruction/" },
              { title: "Problem Challenge 2: Minimum Height Trees (hard)", link: "https://leetcode.com/problems/minimum-height-trees/" }
          ]
      },
      {
          pattern: "Pattern: Union Find",
          questions: [
              { title: "Redundant Connection (medium)", link: "https://leetcode.com/problems/redundant-connection/" },
              { title: "Number of Provinces (medium)", link: "https://leetcode.com/problems/number-of-provinces/" },
              { title: "Is Graph Bipartite? (medium)", link: "https://leetcode.com/problems/is-graph-bipartite/" },
              { title: "Path With Minimum Effort (medium)", link: "https://leetcode.com/problems/path-with-minimum-effort/" }
          ]
      },
      {
          pattern: "Ordered Set",
          questions: [
              { title: "Merge Similar Items (easy)", link: "https://leetcode.com/problems/merge-similar-items/" },
              { title: "132 Pattern (medium)", link: "https://leetcode.com/problems/132-pattern/" },
              { title: "My Calendar I (medium)", link: "https://leetcode.com/problems/my-calendar-i/" }
          ]
      }
  ];

  // =====================================================================
  // APP LOGIC
  // =====================================================================

  const STORAGE_KEY = 'codeTrackerData_v2';
  let appData = [];
  let unlockedAchievements = new Set();

  // Pattern emoji icons
  const PATTERN_ICONS = [
    '👆','⚡','🪟','📈','➕','🔀','🔄','🔗','📚','📉',
    '#️⃣','🌳','🌲','🕸️','🏝️','⚖️','🧩','🔍','⊕','🏆',
    '🌊','💡','🎒','🔙','🌐','🗂️','🔗','📦'
  ];

  const ACHIEVEMENTS = [
      {
          id: 'first-steps',
          icon: '🥉',
          title: 'First Steps',
          subtitle: 'Complete your first 5 questions.',
          goal: stats => stats.solved,
          target: 5,
          valueLabel: stats => `${stats.solved}/5 solved`
      },
      {
          id: 'pattern-master',
          icon: '🏆',
          title: 'Pattern Master',
          subtitle: 'Fully finish 3 pattern sections.',
          goal: stats => stats.completedPatterns,
          target: 3,
          valueLabel: stats => `${stats.completedPatterns}/3 sections`
      },
      {
          id: 'consistency-king',
          icon: '🔥',
          title: 'Consistency',
          subtitle: 'Reach a 7-question streak toward your next push.',
          goal: stats => stats.nextStreak,
          target: 7,
          valueLabel: stats => `${stats.nextStreak}/7 recent wins`
      },
      {
          id: 'legend-mode',
          icon: '👑',
          title: 'Legend Mode',
          subtitle: 'Hit 50% overall tracker completion.',
          goal: stats => stats.percent,
          target: 50,
          valueLabel: stats => `${stats.percent}% complete`
      }
  ];

  /**
   * Detect difficulty from question title string.
   * Returns 'easy' | 'medium' | 'hard' | null
   */
  function getDifficulty(title) {
      const t = title.toLowerCase();
      if (t.includes('(hard)') || t.includes(' hard)') || t.includes('(hard'))  return 'hard';
      if (t.includes('(medium)') || t.includes(' medium)') || t.includes('(med)')) return 'medium';
      if (t.includes('(easy)') || t.includes(' easy)')) return 'easy';
      return null;
  }

  /** Build difficulty badge HTML */
  function difficultyBadge(title) {
      const d = getDifficulty(title);
      if (!d) return '';
      const labels = { easy: 'Easy', medium: 'Med', hard: 'Hard' };
      return `<span class="difficulty-badge badge-${d}">${labels[d]}</span>`;
  }

  function getProgressStats() {
      let total = 0;
      let solved = 0;
      let completedPatterns = 0;

      appData.forEach(pattern => {
          total += pattern.questions.length;
          const doneCount = pattern.questions.filter(q => q.done).length;
          solved += doneCount;
          if (pattern.questions.length > 0 && doneCount === pattern.questions.length) {
              completedPatterns++;
          }
      });

      const percent = total === 0 ? 0 : Math.round((solved / total) * 100);
      const nextStreak = solved % 7 === 0 && solved !== 0 ? 7 : solved % 7;
      const remaining = total - solved;

      return { total, solved, percent, completedPatterns, nextStreak, remaining };
  }

  function renderAchievements(stats = getProgressStats()) {
      const grid = document.getElementById('achievements-grid');
      if (!grid) return;

      grid.innerHTML = ACHIEVEMENTS.map(item => {
          const current = item.goal(stats);
          const pct = Math.min(100, Math.round((current / item.target) * 100));
          const unlocked = current >= item.target;

          return `
            <article class="achievement-card${unlocked ? ' unlocked' : ''}">
              <div class="achievement-top">
                <div class="achievement-icon">${item.icon}</div>
                <span class="achievement-status">${unlocked ? 'Unlocked' : 'In Progress'}</span>
              </div>
              <div class="achievement-title">${item.title}</div>
              <div class="achievement-subtitle">${item.subtitle}</div>
              <div class="achievement-progress">
                <div class="achievement-progress-bar" style="width:${pct}%"></div>
              </div>
              <div class="achievement-footer">
                <span>${item.valueLabel(stats)}</span>
                <span class="achievement-value">${pct}%</span>
              </div>
            </article>
          `;
      }).join('');
  }

  function checkAchievements(stats = getProgressStats()) {
      ACHIEVEMENTS.forEach(item => {
          const isUnlocked = item.goal(stats) >= item.target;
          if (isUnlocked && !unlockedAchievements.has(item.id)) {
              unlockedAchievements.add(item.id);
              showToast(item.icon, `${item.title} unlocked!`);
          }
      });
  }

  // ── Init ─────────────────────────────────────────────────────────────
  function init() {
      loadData();
      unlockedAchievements = new Set(
          ACHIEVEMENTS.filter(item => item.goal(getProgressStats()) >= item.target).map(item => item.id)
      );
      renderAchievements();
      renderTracker();
      updateGlobalProgress();
      setupSearch();
  }

  // ── Persistence ───────────────────────────────────────────────────────
  function loadData() {
      try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
              const parsed = JSON.parse(stored);
              // Merge stored `done` state onto fresh rawData so new questions always appear
              appData = JSON.parse(JSON.stringify(rawData));
              appData.forEach(pattern => {
                  const storedPattern = parsed.find(p => p.pattern === pattern.pattern);
                  if (storedPattern) {
                      pattern.questions.forEach(q => {
                          const sq = storedPattern.questions.find(sq => sq.title === q.title);
                          if (sq) q.done = !!sq.done;
                      });
                  }
              });
          } else {
              appData = JSON.parse(JSON.stringify(rawData));
          }
      } catch (e) {
          console.warn('Failed to load saved data, starting fresh.', e);
          appData = JSON.parse(JSON.stringify(rawData));
      }
  }

  function saveData() {
      try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
          console.warn('Failed to save data to localStorage.', e);
      }
      updateGlobalProgress();
      const stats = getProgressStats();
      renderAchievements(stats);
      checkAchievements(stats);
  }

  // ── Render ────────────────────────────────────────────────────────────
  function renderTracker(filterText = '') {
      const container = document.getElementById('tracker-container');
      container.innerHTML = '';
      const lowerFilter = filterText.toLowerCase().trim();
      let visibleCount = 0;

      appData.forEach((pattern, pIndex) => {
          const patternMatches = pattern.pattern.toLowerCase().includes(lowerFilter);
          const filteredQuestions = pattern.questions.filter(q =>
              q.title.toLowerCase().includes(lowerFilter)
          );

          if (lowerFilter && !patternMatches && filteredQuestions.length === 0) return;
          visibleCount++;

          const totalInPattern     = pattern.questions.length;
          const completedInPattern = pattern.questions.filter(q => q.done).length;
          const pctInPattern       = totalInPattern === 0 ? 0 : Math.round((completedInPattern / totalInPattern) * 100);
          const allDone            = completedInPattern === totalInPattern;

          // ── Section wrapper ──
          const section = document.createElement('div');
          section.className = `pattern-section${allDone ? ' all-done' : ''}`;
          section.dataset.pIndex = pIndex;

          // Open by default when searching; closed otherwise
          const isOpen = lowerFilter.length > 0;

          // ── Header ──
          const header = document.createElement('div');
          header.className = `pattern-header${isOpen ? ' active' : ''}`;

          const icon = PATTERN_ICONS[pIndex % PATTERN_ICONS.length];
          const statusClass = allDone ? 'pattern-status completed-badge' : 'pattern-status';
          const statusText  = allDone ? '✓ All Done' : `${completedInPattern}/${totalInPattern}`;

          header.innerHTML = `
            <div class="pattern-header-left">
              <span class="pattern-icon">${icon}</span>
              <span class="pattern-title">${pattern.pattern}</span>
            </div>
            <div class="pattern-header-right">
              <span class="${statusClass}">${statusText}</span>
              <svg class="chevron" fill="none" height="16" stroke="currentColor" stroke-linecap="round"
                   stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="16">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          `;

          header.addEventListener('click', () => {
              const list = section.querySelector('.question-list');
              const open = header.classList.toggle('active');
              list.classList.toggle('open', open);
          });

          // ── Mini progress bar ──
          const miniProg = document.createElement('div');
          miniProg.className = 'pattern-mini-progress';
          miniProg.innerHTML = `<div class="pattern-mini-bar" style="width:${pctInPattern}%"></div>`;

          // ── Question list ──
          const list = document.createElement('div');
          list.className = `question-list${isOpen ? ' open' : ''}`;

          const questionsToRender = (lowerFilter && !patternMatches) ? filteredQuestions : pattern.questions;

          questionsToRender.forEach(q => {
              const originalQIndex = pattern.questions.indexOf(q);
              const checkId = `check-${pIndex}-${originalQIndex}`;

              const item = document.createElement('div');
              item.className = `question-item${q.done ? ' completed' : ''}`;
              item.id = `q-${pIndex}-${originalQIndex}`;

              const hasLink = q.link && q.link !== '#';
              const badge   = difficultyBadge(q.title);
              const externalIcon = hasLink
                  ? `<svg class="external-link-icon" fill="none" height="13" stroke="currentColor"
                          stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          viewBox="0 0 24 24" width="13">
                       <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                       <polyline points="15 3 21 3 21 9"/>
                       <line x1="10" y1="14" x2="21" y2="3"/>
                     </svg>`
                  : '';

              item.innerHTML = `
                <label class="checkbox-label" for="${checkId}" title="${q.done ? 'Mark incomplete' : 'Mark complete'}">
                  <input type="checkbox" id="${checkId}" ${q.done ? 'checked' : ''}>
                  <span class="checkmark">
                    <svg fill="none" height="12" stroke="currentColor" stroke-linecap="round"
                         stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" width="12">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </label>
                <div class="question-content">
                  <a href="${q.link}" target="${hasLink ? '_blank' : '_self'}" rel="noopener noreferrer"
                     class="question-link" title="${q.title}"
                     onclick="${!hasLink ? 'return false;' : ''}">${q.title}</a>
                  <div class="question-meta">
                    ${badge}
                    ${externalIcon}
                  </div>
                </div>
              `;

              // Attach checkbox change listener — the KEY FIX
              const checkbox = item.querySelector(`#${checkId}`);
              checkbox.addEventListener('change', () => toggleQuestion(pIndex, originalQIndex));

              list.appendChild(item);
          });

          section.appendChild(header);
          section.appendChild(miniProg);
          section.appendChild(list);
          container.appendChild(section);
      });

      if (visibleCount === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <svg fill="none" height="48" stroke="currentColor" stroke-linecap="round"
                   stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="48">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
              <p>No questions found for "<strong>${filterText}</strong>"</p>
            </div>`;
      }
  }

  // ── Toggle ────────────────────────────────────────────────────────────
  function toggleQuestion(pIndex, qIndex) {
      const q = appData[pIndex].questions[qIndex];
      q.done = !q.done;

      // Update item class
      const item = document.getElementById(`q-${pIndex}-${qIndex}`);
      if (item) {
          item.classList.toggle('completed', q.done);
          item.classList.remove('just-completed');
          if (q.done) {
              void item.offsetWidth;
              item.classList.add('just-completed');
          }
          // Sync checkbox visual state (it's already toggled by native change, but just in case)
          const cb = item.querySelector('input[type="checkbox"]');
          if (cb) cb.checked = q.done;
      }

      // Update pattern header badge + mini bar
      const section = document.querySelector(`.pattern-section[data-p-index="${pIndex}"]`)
                   || document.getElementById(`q-${pIndex}-${qIndex}`)?.closest('.pattern-section');
      if (section) {
          const total    = appData[pIndex].questions.length;
          const done     = appData[pIndex].questions.filter(q => q.done).length;
          const pct      = Math.round((done / total) * 100);
          const allDone  = done === total;

          const statusEl = section.querySelector('.pattern-status');
          if (statusEl) {
              statusEl.className = allDone ? 'pattern-status completed-badge' : 'pattern-status';
              statusEl.textContent = allDone ? '🏆 Pattern Cleared' : `${done}/${total}`;
          }

          const miniBar = section.querySelector('.pattern-mini-bar');
          if (miniBar) miniBar.style.width = `${pct}%`;

          section.classList.toggle('all-done', allDone);
      }

      saveData();

      const stats = getProgressStats();
      if (q.done) {
          const completedPattern = appData[pIndex].questions.every(question => question.done);
          if (completedPattern) {
              showToast('🏆', `${appData[pIndex].pattern} completed!`);
          } else {
              showToast('✨', `${stats.solved} solved • ${stats.remaining} to go`);
          }
      } else {
          showToast('↩', 'Marked incomplete');
      }
  }

  // ── Global Progress ───────────────────────────────────────────────────
  function updateGlobalProgress() {
      const stats = getProgressStats();

      document.getElementById('main-progress-bar').style.width = `${stats.percent}%`;
      document.getElementById('progress-text').textContent    = `${stats.percent}%`;
      document.getElementById('progress-percent').textContent = `${stats.percent}%`;
      document.getElementById('solved-count').textContent     = stats.solved;
      document.getElementById('total-count').textContent      = stats.total;
  }

  // ── Search ────────────────────────────────────────────────────────────
  function setupSearch() {
      document.getElementById('search-input').addEventListener('input', e => {
          renderTracker(e.target.value);
      });
  }

  // ── Reset ─────────────────────────────────────────────────────────────
  window.resetData = function () {
      if (confirm('Reset ALL progress? This cannot be undone.')) {
          localStorage.removeItem(STORAGE_KEY);
          loadData();
          renderTracker();
          updateGlobalProgress();
          showToast('🗑️', 'Progress has been reset');
      }
  };

  // ── Daily Challenge ───────────────────────────────────────────────────
  window.pickDailyChallenge = function () {
      const incomplete = [];
      appData.forEach((p, pIndex) => {
          p.questions.forEach((q, qIndex) => {
              if (!q.done) incomplete.push({ pIndex, qIndex });
          });
      });

      if (incomplete.length === 0) {
          showToast('🎉', 'You completed everything!');
          return;
      }

      const pick = incomplete[Math.floor(Math.random() * incomplete.length)];

      // Clear search and re-render
      document.getElementById('search-input').value = '';
      renderTracker();

      // Find the rendered section for this pIndex
      const allSections = document.querySelectorAll('.pattern-section');
      let targetSection = null;
      allSections.forEach(sec => {
          if (parseInt(sec.dataset.pIndex) === pick.pIndex) targetSection = sec;
      });

      if (targetSection) {
          const header = targetSection.querySelector('.pattern-header');
          const list   = targetSection.querySelector('.question-list');
          header.classList.add('active');
          list.classList.add('open');
      }

      setTimeout(() => {
          const element = document.getElementById(`q-${pick.pIndex}-${pick.qIndex}`);
          if (element) {
              document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
              element.classList.add('highlight');
              element.scrollIntoView({ behavior: 'smooth', block: 'center' });
              showToast('🎯', 'Today\'s challenge picked!');
          }
      }, 80);
  };

  // ── Toast ─────────────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(icon, message) {
      const toast   = document.getElementById('toast');
      const iconEl  = document.getElementById('toast-icon');
      const msgEl   = document.getElementById('toast-message');
      iconEl.textContent  = icon;
      msgEl.textContent   = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ── Boot ──────────────────────────────────────────────────────────────
  init();

</script>
</body>
